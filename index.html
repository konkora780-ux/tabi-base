<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅ベース</title>
<meta name="theme-color" content="#0f6e8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅ベース">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<style>
  :root {
    --bg: #f4f7f8; --card: #ffffff; --ink: #1c2b33; --sub: #5a6b74; --line: #d9e2e6;
    --main: #0f6e8c; --main-ink: #ffffff; --ok: #1d7a46; --warn: #a15c00; --ng: #b3261e;
    --ok-bg: #e6f4ec; --warn-bg: #fdf1e0; --ng-bg: #fbe9e8; --soft: #e8f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10181c; --card: #1a252b; --ink: #e8eef1; --sub: #a3b3bb; --line: #2c3a41;
      --main: #4fb3d1; --main-ink: #062430; --ok: #6fd39a; --warn: #f0b35a; --ng: #ff8a80;
      --ok-bg: #173225; --warn-bg: #352812; --ng-bg: #3a1a18; --soft: #1f3540;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10181c; --card: #1a252b; --ink: #e8eef1; --sub: #a3b3bb; --line: #2c3a41;
    --main: #4fb3d1; --main-ink: #062430; --ok: #6fd39a; --warn: #f0b35a; --ng: #ff8a80;
    --ok-bg: #173225; --warn-bg: #352812; --ng-bg: #3a1a18; --soft: #1f3540;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 17px; line-height: 1.6;
    padding: env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom));
  }
  main { max-width: 640px; margin: 0 auto; }
  header.top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 4px; }
  header.top h1 { font-size: 22px; margin: 0; }
  .status { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
  .tag { font-size: 14px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.ng { background: var(--ng-bg); color: var(--ng); }
  .tag.plain { background: var(--soft); color: var(--sub); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 14px 0; }
  h2 { font-size: 18px; margin: 0 0 10px; }
  .next { border: 2px solid var(--main); }
  .next .label { color: var(--main); font-weight: 700; font-size: 15px; }
  .next .big { font-size: 22px; font-weight: 800; margin: 4px 0; }
  button, .btn {
    font: inherit; font-weight: 600; width: 100%; min-height: 52px; border-radius: 12px; border: 0;
    background: var(--main); color: var(--main-ink); margin: 6px 0; padding: 10px 14px; cursor: pointer;
    display: block; text-align: center; text-decoration: none;
  }
  button.sub, .btn.sub { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
  button.danger { background: var(--ng-bg); color: var(--ng); border: 1px solid var(--ng); }
  button:disabled { opacity: .45; cursor: default; }
  input {
    font: inherit; width: 100%; min-height: 50px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin: 4px 0;
  }
  label { display: block; font-size: 15px; color: var(--sub); margin-top: 8px; }
  .hint { color: var(--sub); font-size: 15px; margin: 6px 0; }
  .msg { padding: 10px 12px; border-radius: 10px; margin: 8px 0 0; font-size: 15px; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg.ng { background: var(--ng-bg); color: var(--ng); }
  .todo { list-style: none; padding: 0; margin: 0; }
  .todo li { padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .todo li:last-child { border-bottom: 0; }
  .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 6px 0; }
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    display: flex; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs a {
    flex: 1; text-align: center; text-decoration: none; color: var(--sub); font-size: 14px; font-weight: 700;
    padding: 8px 0; border-radius: 10px; min-height: 48px;
  }
  nav.tabs a.on { color: var(--main); background: var(--soft); }
  nav.tabs .ico { display: block; font-size: 20px; line-height: 1.2; }
  .hidden { display: none !important; }
  .banner { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 14px; margin-top: 10px; font-weight: 700; }
  .banner button { margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>旅ベース</h1>
    <span class="tag plain" id="verTag"></span>
  </header>
  <div class="status" id="statusBar"></div>
  <div id="updateBanner" class="banner hidden">新しい版があります
    <button id="btnUpdate" class="sub">更新する</button>
  </div>
  <div id="pushBanner" class="banner hidden"></div>

  <!-- ログイン -->
  <div id="viewLogin" class="hidden">
    <section>
      <h2>ログイン</h2>
      <p class="hint">メールに届く数字のコードでログインします。パスワードは使いません。</p>
      <label for="email">メールアドレス</label>
      <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="example@mail.com">
      <button id="btnSendCode">確認コードをメールで受け取る</button>
      <div id="codeBox" class="hidden">
        <label for="code">メールに届いた数字のコード</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456">
        <button id="btnVerify">ログインする</button>
        <button id="btnResend" class="sub">コードをもう一度送る</button>
      </div>
      <div id="loginMsg"></div>
    </section>
    <section id="installCardLogin" class="hidden"></section>
  </div>

  <!-- ホーム -->
  <div id="viewHome" class="hidden">
    <section class="next" id="nextCard">
      <div class="label">次の行動</div>
      <div class="big">旅はまだありません</div>
      <p class="hint">旅の作成は次の更新で追加します。</p>
    </section>
    <section id="todoCard">
      <h2>はじめにやること</h2>
      <ul class="todo" id="todoList"></ul>
    </section>
  </div>

  <!-- 設定 -->
  <div id="viewSettings" class="hidden">
    <section>
      <h2>アカウント</h2>
      <div class="row"><span>ログイン中</span><b id="who"></b></div>
    </section>
    <section>
      <h2>通知</h2>
      <div class="row"><span>この端末の通知</span><span id="pushState" class="tag plain"></span></div>
      <button id="btnPush">通知をオンにする</button>
      <button id="btnTestPush" class="sub">テスト通知を送る</button>
      <a class="btn sub" href="./push-test.html">通知の詳しいテスト・送信記録</a>
      <div id="pushMsg"></div>
    </section>
    <section>
      <h2>ログアウト</h2>
      <p class="hint">ログアウトすると、この端末に保存した旅程と通知の登録を消します。旅程そのものはサーバーに残るので、もう一度ログインすれば見られます。</p>
      <button id="btnLogout" class="danger">ログアウトする</button>
      <div id="logoutMsg"></div>
    </section>
  </div>
</main>

<nav class="tabs hidden" id="tabs">
  <a href="#/home" data-view="home"><span class="ico">🏠</span>ホーム</a>
  <a href="#/settings" data-view="settings"><span class="ico">⚙️</span>設定</a>
</nav>

<script src="./lib/supabase-2.117.3.js"></script>
<script>
// ===== 設定（どちらも公開して問題ない値。秘密鍵はここに入れない） =====
const APP_VERSION = '0.2.1';
const SUPABASE_URL = 'https://hortngwcijhjagwmcoxo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qy1V664U_HDLq_YEXkwo7w_fF6GpRBI';
const FUNCTION_URL = SUPABASE_URL + '/functions/v1/tabi-push';
// 端末内に保存するデータベースの名前（ログアウト時にまとめて消す）
const LOCAL_DBS = ['tabi-base', 'tabi-push-test'];
// ======================================================================

const $ = (id) => document.getElementById(id);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
});
let swReg = null;
let user = null;
let hasSub = false; // この端末が通知先として登録されているか
let regDone = false; // この画面を開いてから通知先の登録を済ませたか

const ua = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(ua);
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function show(el, text, kind = 'ok') { $(el).innerHTML = text ? `<div class="msg ${kind}">${text}</div>` : ''; }
function deviceLabel() { return (isIOS ? 'iPhone/iPad' : isAndroid ? 'Android' : 'パソコン') + (standalone ? '（ホーム画面）' : '（ブラウザ）'); }
function friendlyError(e) {
  const m = String(e?.message || e || '');
  if (/rate limit|too many|security purposes/i.test(m)) return '続けて送りすぎました。1分ほど待ってからもう一度お試しください';
  if (/expired|invalid/i.test(m) && /token|otp/i.test(m)) return 'コードが違うか、期限が切れています。新しいコードを受け取ってください';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return '通信できませんでした。電波の良い所でもう一度お試しください';
  return m;
}

// ---------- 状態バー ----------
function pushState() {
  if (!('Notification' in window) || !('PushManager' in window)) return ['使えない端末', 'ng'];
  if (isIOS && !standalone) return ['ホーム画面から開く必要あり', 'warn'];
  if (Notification.permission === 'granted') return hasSub ? ['オン', 'ok'] : ['この端末は未登録', 'warn'];
  if (Notification.permission === 'denied') return ['拒否されています', 'ng'];
  return ['要確認', 'warn'];
}
function renderStatus() {
  const online = navigator.onLine;
  const [ps, pc] = pushState();
  const tags = [
    online ? '' : '<span class="tag ng">オフライン中</span>',
    `<span class="tag plain">最終同期 ${esc(localStorage.getItem('tabi.lastSync') || '—')}</span>`,
    `<span class="tag ${pc}">通知：${ps}</span>`,
  ];
  $('statusBar').innerHTML = tags.join('');
  $('pushState').textContent = ps;
  $('pushState').className = 'tag ' + pc;
  $('btnPush').classList.toggle('hidden', ps === 'オン');
}

// ---------- はじめにやること ----------
function installHelpHtml() {
  if (isIOS) return 'Safariの下の「共有」ボタン（□に↑）→「ホーム画面に追加」→ 追加した「旅ベース」アイコンから開いてください。';
  if (isAndroid) return 'Chromeの右上「︙」→「ホーム画面に追加」または「アプリをインストール」を押してください。';
  return 'スマートフォンで開くと、ホーム画面に追加できます。';
}
function renderTodo() {
  const items = [];
  items.push([standalone, 'ホーム画面に追加する', standalone ? '完了' : installHelpHtml()]);
  const granted = 'Notification' in window && Notification.permission === 'granted';
  items.push([granted, '通知をオンにする', granted ? '完了' : '「設定」→「通知をオンにする」を押してください。']);
  $('todoList').innerHTML = items.map(([done, t, d]) =>
    `<li><span class="tag ${done ? 'ok' : 'warn'}">${done ? '済' : '未'}</span> <b>${t}</b><div class="hint">${d}</div></li>`).join('');
  $('todoCard').classList.toggle('hidden', items.every(([d]) => d));
  const ic = $('installCardLogin');
  if (isIOS && !standalone) {
    ic.innerHTML = `<h2>先にホーム画面に追加してください</h2><p class="hint">iPhoneでは、ホーム画面に追加したアプリでログインしないと通知が届きません。${installHelpHtml()}</p>`;
    ic.classList.remove('hidden');
  } else ic.classList.add('hidden');
}

// ---------- 画面の切り替え ----------
function route() {
  const v = (location.hash.replace('#/', '') || 'home');
  const view = !user ? 'login' : (['home', 'settings'].includes(v) ? v : 'home');
  for (const name of ['login', 'home', 'settings']) {
    $('view' + name[0].toUpperCase() + name.slice(1)).classList.toggle('hidden', name !== view);
  }
  $('tabs').classList.toggle('hidden', !user);
  for (const a of document.querySelectorAll('nav.tabs a')) a.classList.toggle('on', a.dataset.view === view);
  renderStatus(); renderTodo();
}
window.addEventListener('hashchange', route);
window.addEventListener('online', renderStatus);
window.addEventListener('offline', renderStatus);

// ---------- ログイン ----------
async function sendCode() {
  const email = $('email').value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return show('loginMsg', 'メールアドレスを正しく入れてください', 'warn');
  $('btnSendCode').disabled = $('btnResend').disabled = true;
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
  $('btnSendCode').disabled = $('btnResend').disabled = false;
  if (error) return show('loginMsg', esc(friendlyError(error)), 'ng');
  localStorage.setItem('tabi.lastEmail', email);
  $('codeBox').classList.remove('hidden');
  show('loginMsg', 'メールを送りました。届いた数字を入れてください（迷惑メールフォルダも確認してください）。メールの中のリンクは押さないでください');
  $('code').focus();
}
$('btnSendCode').onclick = sendCode;
$('btnResend').onclick = sendCode;
$('btnVerify').onclick = async () => {
  const email = $('email').value.trim();
  const token = $('code').value.replace(/\D/g, '');
  if (token.length < 6) return show('loginMsg', 'コードを入れてください', 'warn');
  $('btnVerify').disabled = true;
  const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
  $('btnVerify').disabled = false;
  if (error) return show('loginMsg', esc(friendlyError(error)), 'ng');
  show('loginMsg', '');
  $('code').value = '';
  location.hash = '#/home';
};

// ---------- 通知 ----------
function b64ToUint8(b64) {
  const pad = '='.repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}
function keyToB64(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function callFn(action, extra = {}) {
  const { data } = await sb.auth.getSession();
  const res = await fetch(FUNCTION_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + (data.session?.access_token ?? SUPABASE_ANON_KEY) },
    body: JSON.stringify({ action, ...extra }),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || ('エラー ' + res.status));
  return body;
}
async function registerDevice() {
  if (!swReg) throw new Error('準備中です。少し待ってからもう一度押してください');
  const { publicKey } = await callFn('vapid-key');
  let sub = await swReg.pushManager.getSubscription();
  if (sub && sub.options?.applicationServerKey && keyToB64(sub.options.applicationServerKey) !== publicKey) {
    await sub.unsubscribe(); sub = null;
  }
  if (!sub) sub = await swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToUint8(publicKey) });
  const j = sub.toJSON();
  const { error } = await sb.rpc('tabi_register_push_subscription', {
    p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth,
    p_device_label: deviceLabel(), p_user_agent: ua,
  });
  if (error) throw new Error(error.message);
}
$('btnPush').onclick = async () => {
  try {
    if (isIOS && !standalone) throw new Error('ホーム画面に追加した「旅ベース」アイコンから開いてください');
    if (!('Notification' in window)) throw new Error('この端末・ブラウザは通知に対応していません');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error('通知が許可されませんでした。端末の「設定」→「通知」→「旅ベース」で許可できます');
    await registerDevice();
    await checkSub();
    show('pushMsg', 'この端末で通知を受け取れるようにしました。「テスト通知を送る」で確かめられます');
  } catch (e) { show('pushMsg', esc(friendlyError(e)), 'ng'); }
  renderStatus(); renderTodo();
};
$('btnTestPush').onclick = async () => {
  try {
    show('pushMsg', '送信しています…', 'warn');
    const r = await callFn('send-now', { title: '旅ベース テスト通知', body: 'この通知が見えれば、通知は届いています' });
    const n = (r.results || []).filter((x) => x.result === 'accepted').length;
    if (!(r.results || []).length) return show('pushMsg', '通知を受け取る端末がありません。先に「通知をオンにする」を押してください', 'warn');
    show('pushMsg', `送信しました（${n}台）。通知が届くか確かめてください`);
  } catch (e) { show('pushMsg', esc(friendlyError(e)), 'ng'); }
};

// ---------- ログアウト（端末内の旅程・通知先を消す） ----------
function deleteLocalDb(name) {
  return new Promise((resolve) => {
    try {
      const r = indexedDB.deleteDatabase(name);
      r.onsuccess = r.onerror = r.onblocked = () => resolve();
    } catch { resolve(); }
  });
}
async function clearDeviceData() {
  // 1) 通知先：サーバー側の登録を消してから、端末の登録も解除する
  try {
    const sub = swReg && await swReg.pushManager.getSubscription();
    if (sub) {
      if (navigator.onLine && user) {
        await sb.from('tabi_push_subscriptions').delete().eq('endpoint', sub.endpoint);
      }
      await sub.unsubscribe();
    }
  } catch (e) { console.warn(e); }
  // 2) 端末内の旅程データ
  for (const name of LOCAL_DBS) await deleteLocalDb(name);
  // 3) 旅程のキャッシュ（画面の保存は残す）
  try { for (const k of await caches.keys()) if (k.startsWith('tabi-data')) await caches.delete(k); } catch {}
  // 4) その他の記録
  for (const k of Object.keys(localStorage)) if (k.startsWith('tabi.') && k !== 'tabi.lastEmail') localStorage.removeItem(k);
}
$('btnLogout').onclick = async () => {
  if (!confirmLogout()) return;
  $('btnLogout').disabled = true;
  await clearDeviceData();
  hasSub = false; regDone = false;
  await sb.auth.signOut({ scope: 'local' });
  $('btnLogout').disabled = false;
  show('loginMsg', 'ログアウトしました。この端末の旅程と通知の登録を消しました');
  location.hash = '#/home';
};
// 確認は2回押し方式（画面を止めるダイアログを使わない）
let logoutArmed = 0;
function confirmLogout() {
  if (Date.now() - logoutArmed < 5000) { logoutArmed = 0; return true; }
  logoutArmed = Date.now();
  show('logoutMsg', 'もう一度「ログアウトする」を押すとログアウトします', 'warn');
  setTimeout(() => { if (logoutArmed && Date.now() - logoutArmed >= 5000) { logoutArmed = 0; show('logoutMsg', ''); } }, 5200);
  return false;
}

// ---------- 起動 ----------
async function checkSub() {
  try { hasSub = !!(swReg && await swReg.pushManager.getSubscription()); } catch { hasSub = false; }
}
async function refreshUser() {
  const { data } = await sb.auth.getSession();
  user = data.session?.user ?? null;
  $('who').textContent = user?.email ?? '';
  // ログインした直後、通知を許可済みならこの端末を通知先に登録し直す（ログアウトで消しているため）
  if (user && !regDone && swReg && 'Notification' in window && Notification.permission === 'granted' && navigator.onLine) {
    try { await registerDevice(); regDone = true; } catch (e) { console.warn(e); }
  }
  await checkSub();
  route();
}
sb.auth.onAuthStateChange(() => setTimeout(refreshUser, 0));

(async () => {
  $('verTag').textContent = 'v' + APP_VERSION;
  $('email').value = localStorage.getItem('tabi.lastEmail') || '';
  if (new URLSearchParams(location.search).get('from') === 'push') {
    $('pushBanner').textContent = '通知から開きました';
    $('pushBanner').classList.remove('hidden');
    setTimeout(() => $('pushBanner').classList.add('hidden'), 6000);
  }
  if ('serviceWorker' in navigator) {
    try {
      swReg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
      // 新しい版が入ったら案内する
      let hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadController) $('updateBanner').classList.remove('hidden');
        hadController = true;
      });
      swReg.update().catch(() => {});
    } catch (e) { console.error(e); }
  }
  $('btnUpdate').onclick = () => location.reload();
  if (swReg) await navigator.serviceWorker.ready;
  await refreshUser(); // ログイン済み＋通知許可済みなら、ここで通知先の登録も最新になる
})();
</script>
</body>
</html>
